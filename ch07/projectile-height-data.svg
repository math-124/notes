<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Measured projectile height over time</title>
  <desc id="desc">A scatter plot of the five measured points: (0, 1.2), (1, 15.2), (2, 22.2), (3, 15.2), and (4, 1.2).</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="1000" height="600" rx="18" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" class="sans" font-size="29" font-weight="700" fill="#172033">Measured projectile height</text>
  <text x="500" y="72" text-anchor="middle" class="sans" font-size="17" fill="#64748b">Five height measurements suggest a curved trajectory</text>

  <!-- Grid -->
  <g stroke="#dbe4ee" stroke-width="1.4">
    <line x1="140" y1="500" x2="900" y2="500"/>
    <line x1="140" y1="420" x2="900" y2="420"/>
    <line x1="140" y1="340" x2="900" y2="340"/>
    <line x1="140" y1="260" x2="900" y2="260"/>
    <line x1="140" y1="180" x2="900" y2="180"/>
    <line x1="140" y1="100" x2="900" y2="100"/>
  </g>

  <!-- Axes -->
  <line x1="140" y1="500" x2="920" y2="500" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <line x1="160" y1="520" x2="160" y2="82" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="935" y="508" class="math" font-size="24" fill="#172033">t</text>
  <text x="145" y="75" class="math" font-size="24" fill="#172033">h</text>
  <text x="894" y="535" text-anchor="end" class="sans" font-size="16" fill="#64748b">time (seconds)</text>
  <text x="45" y="300" text-anchor="middle" class="sans" font-size="16" fill="#64748b" transform="rotate(-90 45 300)">height (meters)</text>

  <!-- x ticks -->
  <g class="sans" font-size="17" fill="#475569" text-anchor="middle">
    <line x1="160" y1="494" x2="160" y2="506" stroke="#334155" stroke-width="2"/>
    <line x1="340" y1="494" x2="340" y2="506" stroke="#334155" stroke-width="2"/>
    <line x1="520" y1="494" x2="520" y2="506" stroke="#334155" stroke-width="2"/>
    <line x1="700" y1="494" x2="700" y2="506" stroke="#334155" stroke-width="2"/>
    <line x1="880" y1="494" x2="880" y2="506" stroke="#334155" stroke-width="2"/>
    <text x="160" y="527">0</text><text x="340" y="527">1</text><text x="520" y="527">2</text><text x="700" y="527">3</text><text x="880" y="527">4</text>
  </g>

  <!-- y ticks -->
  <g class="sans" font-size="16" fill="#475569" text-anchor="end">
    <text x="145" y="506">0</text><text x="145" y="426">5</text><text x="145" y="346">10</text>
    <text x="145" y="266">15</text><text x="145" y="186">20</text><text x="145" y="106">25</text>
  </g>

  <!-- Light guides from observations to the time axis -->
  <g stroke="#9fb4c8" stroke-width="2" stroke-dasharray="5 7">
    <line x1="160" y1="481" x2="160" y2="500"/>
    <line x1="340" y1="257" x2="340" y2="500"/>
    <line x1="520" y1="145" x2="520" y2="500"/>
    <line x1="700" y1="257" x2="700" y2="500"/>
    <line x1="880" y1="481" x2="880" y2="500"/>
  </g>

  <!-- Measured data -->
  <g fill="#1769aa" stroke="#ffffff" stroke-width="4">
    <circle cx="160" cy="481" r="11"/><circle cx="340" cy="257" r="11"/><circle cx="520" cy="145" r="11"/>
    <circle cx="700" cy="257" r="11"/><circle cx="880" cy="481" r="11"/>
  </g>

  <!-- Point labels -->
  <g class="sans" font-size="18" font-weight="650" fill="#14558a">
    <text x="180" y="470">(0, 1.2)</text>
    <text x="355" y="245">(1, 15.2)</text>
    <text x="520" y="124" text-anchor="middle">(2, 22.2)</text>
    <text x="685" y="245" text-anchor="end">(3, 15.2)</text>
    <text x="860" y="470" text-anchor="end">(4, 1.2)</text>
  </g>

  <rect x="372" y="548" width="256" height="34" rx="9" fill="#eff6ff" stroke="#8db9df" stroke-width="1.3"/>
  <circle cx="397" cy="565" r="7" fill="#1769aa"/>
  <text x="416" y="571" class="sans" font-size="17" fill="#334155">measured data points</text>
</svg>
