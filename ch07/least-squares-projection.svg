<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Least squares as orthogonal projection</title>
  <desc id="desc">A vector b in R3 lies above the plane Col(A). Its perpendicular projection onto the plane is Ax. The residual b minus Ax is perpendicular to the plane.</desc>

  <defs>
    <linearGradient id="plane-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="100%" stop-color="#c7e1fa"/>
    </linearGradient>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; }
    </style>
  </defs>

  <rect width="1000" height="650" rx="18" fill="#ffffff"/>

  <text x="500" y="48" text-anchor="middle" class="label" font-size="28" font-weight="700">Least squares as orthogonal projection</text>
  <text x="500" y="80" text-anchor="middle" class="label" font-size="18" fill="#4b5563">Choose the point in Col(A) closest to b</text>

  <!-- Ambient space and column-space plane -->
  <polygon points="120,540 720,540 890,330 290,330" fill="url(#plane-fill)" stroke="#3b78b4" stroke-width="3"/>
  <line x1="205" y1="498" x2="793" y2="498" stroke="#8db9df" stroke-width="2"/>
  <line x1="259" y1="430" x2="846" y2="430" stroke="#8db9df" stroke-width="2"/>
  <line x1="314" y1="363" x2="857" y2="363" stroke="#8db9df" stroke-width="2"/>
  <line x1="290" y1="330" x2="120" y2="540" stroke="#8db9df" stroke-width="2"/>
  <line x1="470" y1="330" x2="300" y2="540" stroke="#8db9df" stroke-width="2"/>
  <line x1="650" y1="330" x2="480" y2="540" stroke="#8db9df" stroke-width="2"/>
  <line x1="830" y1="330" x2="660" y2="540" stroke="#8db9df" stroke-width="2"/>

  <rect x="673" y="455" width="172" height="45" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#3b78b4" stroke-width="1.5"/>
  <text x="759" y="484" text-anchor="middle" class="label" font-size="22" font-weight="650">Col(A) ⊂ ℝ³</text>

  <!-- Origin and vectors -->
  <circle cx="190" cy="505" r="6" fill="#172033"/>
  <text x="165" y="532" class="label" font-size="18">0</text>

  <!-- b from the origin -->
  <line x1="190" y1="505" x2="518" y2="151" stroke="#d97706" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <circle cx="520" cy="145" r="7" fill="#d97706" stroke="#ffffff" stroke-width="3"/>
  <rect x="536" y="112" width="155" height="54" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="554" y="136" class="label math" font-size="25" font-weight="700">b</text>
  <text x="579" y="137" class="label" font-size="17">target vector</text>
  <text x="554" y="158" class="label" font-size="15" fill="#6b7280">not in Col(A)</text>

  <!-- Ax from the origin to the foot -->
  <line x1="190" y1="505" x2="551" y2="411" stroke="#15803d" stroke-width="6" marker-end="url(#arrow-green)"/>
  <circle cx="555" cy="410" r="8" fill="#15803d" stroke="#ffffff" stroke-width="3"/>
  <rect x="570" y="423" width="204" height="54" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="588" y="448" class="label math" font-size="25" font-weight="700">A x</text>
  <text x="635" y="448" class="label" font-size="17">closest point</text>
  <text x="588" y="469" class="label" font-size="15" fill="#6b7280">orthogonal projection</text>

  <!-- Perpendicular residual from Ax to b -->
  <line x1="555" y1="410" x2="521" y2="153" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-purple)"/>
  <path d="M555 410 L575 407 L572 387 L552 390" fill="none" stroke="#172033" stroke-width="3"/>
  <rect x="285" y="238" width="215" height="62" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="303" y="265" class="label math" font-size="23" font-weight="700">b − A x</text>
  <text x="384" y="265" class="label" font-size="17">residual</text>
  <text x="303" y="289" class="label" font-size="16" fill="#6b7280">perpendicular to Col(A)</text>

  <!-- Conclusion -->
  <rect x="158" y="576" width="684" height="51" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="608" text-anchor="middle" class="label" font-size="21">
    Minimizing ‖A x − b‖ means making the perpendicular residual as short as possible.
  </text>
</svg>
