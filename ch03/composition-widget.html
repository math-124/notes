<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Does the order matter?</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#202124;font:17px/1.4 Palatino,serif}main{padding:16px}h1{font-size:23px;margin:0 0 8px}p{margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block}output{float:right}input{width:100%;min-height:40px;accent-color:#3d81f6}input:focus-visible{outline:3px solid #3d81f6;outline-offset:3px}#plot{height:350px}.hint{font-size:15px;color:#465268}.matrices{display:flex;flex-wrap:wrap;justify-content:space-around;gap:18px}.matrix{display:inline-grid;grid-template-columns:repeat(2,1fr);gap:3px 10px;border-left:2px solid;border-right:2px solid;border-radius:4px;padding:4px 9px;text-align:center;vertical-align:middle}.result{font-size:15px;margin-top:12px}@media(max-width:430px){main{padding:12px}.controls{grid-template-columns:1fr;gap:8px}#plot{height:540px}}</style></head><body><main><h1>Does the order matter?</h1><p class="hint">H stretches horizontally. R rotates. The faint square is the input; the dashed shape is the intermediate step. The arrow tracks e₁.</p>
<div class="controls"><div><label for="angle">Rotation angle <output id="angle-value">90°</output></label><input id="angle" type="range" min="-180" max="180" step="5" value="90"></div><div><label for="stretch">Horizontal stretch <output id="stretch-value">2</output></label><input id="stretch" type="range" min="0" max="3" step="0.1" value="2"></div></div>
<div id="plot" role="img" aria-label="Two orders of stretching and rotation"></div><div class="matrices"><div>RH = <span class="matrix" id="rh" role="img"></span></div><div>HR = <span class="matrix" id="hr" role="img"></span></div></div><p class="result" id="result" role="status" aria-live="polite"></p>
</main><script>/* PLOTLY_BUNDLE */</script><script>
const $=id=>document.getElementById(id),BLUE='#3d81f6',ORANGE='orange',PINK='#d81a60';let busy=false,pending=false;
const mul=(A,B)=>A.map(row=>B[0].map((_,j)=>row.reduce((s,v,k)=>s+v*B[k][j],0)));
const apply=(A,p)=>A.map(row=>row[0]*p[0]+row[1]*p[1]);const fmt=x=>Math.abs(x)<1e-8?'0':Number(x.toFixed(2)).toString().replace('-','−');
async function render(){pending=true;if(busy)return;busy=true;try{while(pending){pending=false;const theta=Number($('angle').value),s=Number($('stretch').value),t=theta*Math.PI/180,R=[[Math.cos(t),-Math.sin(t)],[Math.sin(t),Math.cos(t)]],H=[[s,0],[0,1]],RH=mul(R,H),HR=mul(H,R),square=[[0,0],[1,0],[1,1],[0,1],[0,0]],narrow=document.querySelector('main').clientWidth<430,data=[],annotations=[];
for(const [i,first,total] of [[1,H,RH],[2,R,HR]]){const axis=i===1?'':'2';for(const [M,color,dash,fill] of [[[[1,0],[0,1]],'#cbd5e1','solid',false],[first,ORANGE,'dash',false],[total,BLUE,'solid',true]]){const pts=square.map(p=>apply(M,p));data.push({type:'scatter',x:pts.map(p=>p[0]),y:pts.map(p=>p[1]),xaxis:'x'+axis,yaxis:'y'+axis,mode:'lines',line:{color,width:2,dash},fill:fill?'toself':undefined,fillcolor:'rgba(61,129,246,.15)',hoverinfo:'skip'});}
const q=apply(total,[1,0]);annotations.push({x:q[0],y:q[1],ax:0,ay:0,xref:'x'+axis,yref:'y'+axis,axref:'x'+axis,ayref:'y'+axis,text:'',showarrow:true,arrowhead:3,arrowcolor:PINK,arrowwidth:3},{x:.5,y:1,xref:'x'+axis+' domain',yref:'y'+axis+' domain',text:i===1?'First H, then R → RH':'First R, then H → HR',showarrow:false,yshift:18,font:{size:16}});}
const base={range:[-3.5,3.5],dtick:1,zerolinecolor:'#9caaba',gridcolor:'#edf0f5',fixedrange:true};const layout={paper_bgcolor:'white',plot_bgcolor:'white',font:{family:'Palatino, serif',size:14},margin:{l:30,r:15,t:34,b:28},showlegend:false,annotations,xaxis:{...base,domain:narrow?[0,1]:[0,.43]},yaxis:{...base,domain:narrow?[.57,1]:[0,1],scaleanchor:'x'},xaxis2:{...base,domain:narrow?[0,1]:[.57,1],anchor:'y2'},yaxis2:{...base,domain:narrow?[0,.43]:[0,1],anchor:'x2',scaleanchor:'x2'}};
$('angle-value').textContent=theta+'°';$('stretch-value').textContent=s;$('angle').setAttribute('aria-valuetext',theta+' degrees');$('stretch').setAttribute('aria-valuetext',s+' times');
for(const [id,M]of[['rh',RH],['hr',HR]]){$(id).innerHTML=M.flat().map(v=>'<span>'+fmt(v)+'</span>').join('');$(id).setAttribute('aria-label',id.toUpperCase()+' rows '+M.map(row=>row.map(fmt).join(', ')).join('; '));}
const same=RH.every((row,i)=>row.every((v,j)=>Math.abs(v-HR[i][j])<1e-8));$('result').textContent=same?'These settings give the same matrix. Try 90° and a stretch of 2 to make the order matter.':'Different outputs! The stretch acts along the fixed horizontal axis. Changing its place in the sequence changes what gets stretched.';$('plot').setAttribute('aria-label','At angle '+theta+' degrees and horizontal stretch '+s+', '+$('result').textContent);
await Plotly.react('plot',data,layout,{staticPlot:true,responsive:true,displayModeBar:false});$('plot').querySelectorAll('svg').forEach(svg=>svg.setAttribute('aria-hidden','true'));
}}finally{busy=false;}}
$('angle').oninput=render;$('stretch').oninput=render;let previousWidth=0;new ResizeObserver(()=>{const main=document.querySelector('main');if(window.frameElement)window.frameElement.style.height=Math.ceil(main.getBoundingClientRect().height+4)+'px';if(main.clientWidth!==previousWidth){previousWidth=main.clientWidth;render();}}).observe(document.querySelector('main'));render();
</script></body></html>
