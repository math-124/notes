<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build a product one column at a time</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#202124;font:17px/1.4 Palatino,serif}main{padding:16px}h1{font-size:23px;margin:0 0 8px}p{margin:8px 0}.hint{font-size:15px;color:#465268}.equation{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.matrix{display:inline-grid;grid-template-columns:repeat(2,1fr);gap:3px 7px;border-left:2px solid;border-right:2px solid;border-radius:4px;padding:4px 7px;text-align:center}.matrix span{min-width:26px;padding:3px}.vector{grid-template-columns:1fr}.active1{background:#e0ecff;border-bottom:3px solid #3d81f6}.active2{background:#fff1d9;border-bottom:3px dashed orange}.name{text-align:center;font-size:14px;color:#465268}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}button{font:inherit;min-height:42px;padding:6px 12px;background:white;border:1px solid #586577;border-radius:4px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e0ecff;border-color:#3d81f6}button:focus-visible{outline:3px solid #3d81f6;outline-offset:3px}#plot{height:330px}#calculation{min-height:92px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}#status{font-size:15px}@media(max-width:430px){main{padding:12px}.equation{gap:7px}.matrix{gap:3px;padding:3px 5px}.matrix span{min-width:22px;padding:2px}#plot{height:510px}}</style></head><body><main><h1>Build a product one column at a time</h1><p class="hint">Each column of B is a separate input. A transforms it into the matching column of AB.</p>
<div class="equation"><div><div class="name">A · the rule</div><div id="a" class="matrix" role="img" aria-label="A rows: 2, negative 1; 1, 3"><span>2</span><span>−1</span><span>1</span><span>3</span></div></div><div><div class="name">B · the inputs</div><div id="b" class="matrix" role="img" aria-label="B rows: 1, 4; 2, negative 1"></div></div><span>=</span><div><div class="name">AB · the outputs</div><div id="ab" class="matrix" role="img"></div></div></div>
<div class="controls"><button id="column1" aria-pressed="true">Column 1</button><button id="column2" aria-pressed="false">Column 2</button><button id="both" aria-pressed="false">See the full product</button></div>
<div id="plot" role="img" aria-label="First input column and its transformed output"></div><div id="calculation" role="img" aria-label="One times column 1 of A plus two times column 2 of A equals the column vector 0, 7"></div><p id="status" role="status" aria-live="polite"></p>
</main><script>/* PLOTLY_BUNDLE */</script><script>
const $=id=>document.getElementById(id),A=[[2,-1],[1,3]],B=[[1,4],[2,-1]],BLUE='#3d81f6',ORANGE='orange';let selected=0,busy=false,pending=false;
const product=A.map(row=>B[0].map((_,j)=>row.reduce((s,v,k)=>s+v*B[k][j],0)));const vec=xs=>'<span class="matrix vector" aria-hidden="true">'+xs.map(x=>'<span>'+String(x).replace('-','−')+'</span>').join('')+'</span>';
async function render(){pending=true;if(busy)return;busy=true;try{while(pending){pending=false;const narrow=document.querySelector('main').clientWidth<430,data=[],annotations=[];
for(const [id,M]of[['b',B],['ab',product]]){$(id).innerHTML=M.flat().map((v,k)=>{const active=selected===2||k%2===selected;return '<span class="'+(active?'active'+(k%2+1):'')+'">'+(id==='ab'&&!active?'?':String(v).replace('-','−'))+'</span>';}).join('');} $('ab').setAttribute('aria-label','AB rows: '+product.map(row=>row.map((v,j)=>selected===2||j===selected?v:'not revealed').join(', ')).join('; '));
for(const [i,M,title] of [[1,B,'Input columns in ℝ²'],[2,product,'Output columns in ℝ²']]){const axis=i===1?'':'2';for(const j of selected===2?[0,1]:[selected]){const x=M[0][j],y=M[1][j],color=j?ORANGE:BLUE;data.push({type:'scatter',x:[0,x],y:[0,y],xaxis:'x'+axis,yaxis:'y'+axis,mode:'lines',line:{color,width:3,dash:j?'dash':'solid'},hoverinfo:'skip'});annotations.push({x,y,ax:0,ay:0,xref:'x'+axis,yref:'y'+axis,axref:'x'+axis,ayref:'y'+axis,text:'',showarrow:true,arrowhead:3,arrowwidth:2,arrowcolor:color},{x,y,xref:'x'+axis,yref:'y'+axis,text:(i===1?'b':'A b')+(j?'₂':'₁'),showarrow:false,xshift:14,yshift:16,font:{size:16},bgcolor:'white'});}annotations.push({x:.5,y:1,xref:'x'+axis+' domain',yref:'y'+axis+' domain',text:title,showarrow:false,yshift:18,font:{size:16}});}
const base={zerolinecolor:'#9caaba',gridcolor:'#edf0f5',fixedrange:true};await Plotly.react('plot',data,{paper_bgcolor:'white',plot_bgcolor:'white',font:{family:'Palatino, serif',size:14},margin:{l:30,r:20,t:34,b:30},showlegend:false,annotations,xaxis:{...base,range:[-2,5.5],dtick:2,domain:narrow?[0,1]:[0,.43]},yaxis:{...base,range:[-2,4],dtick:2,domain:narrow?[.57,1]:[0,1],scaleanchor:'x'},xaxis2:{...base,range:[-2,11],dtick:2,domain:narrow?[0,1]:[.57,1],anchor:'y2'},yaxis2:{...base,range:[-2,9],dtick:2,domain:narrow?[0,.43]:[0,1],anchor:'x2',scaleanchor:'x2'}},{staticPlot:true,responsive:true,displayModeBar:false});$('plot').querySelectorAll('svg').forEach(svg=>svg.setAttribute('aria-hidden','true'));
for(const [id,j]of[['column1',0],['column2',1],['both',2]])$(id).setAttribute('aria-pressed',String(selected===j));
if(selected<2){const b=B.map(row=>row[selected]),out=product.map(row=>row[selected]);$('calculation').innerHTML=b[0]+vec([2,1])+(b[1]<0?' − ':' + ')+Math.abs(b[1])+vec([-1,3])+' = '+vec(out);$('calculation').setAttribute('aria-label',b[0]+' times column 1 of A plus '+b[1]+' times column 2 of A equals column vector '+out.join(', '));$('status').textContent='Column '+(selected+1)+' stays in position '+(selected+1)+'. The other input is a separate calculation.';}else{$('calculation').textContent='AB collects both output columns in the same order.';$('calculation').setAttribute('aria-label','AB collects both output columns in the same order.');$('status').textContent='A is one rule applied twice: once to each column of B.';}$('plot').setAttribute('aria-label','Input and output arrows for '+(selected===2?'both columns':'column '+(selected+1))+'. '+$('calculation').getAttribute('aria-label'));
}}finally{busy=false;}}
for(const [id,j]of[['column1',0],['column2',1],['both',2]])$(id).onclick=()=>{selected=j;render();};let previousWidth=0;new ResizeObserver(()=>{const main=document.querySelector('main');if(window.frameElement)window.frameElement.style.height=Math.ceil(main.getBoundingClientRect().height+4)+'px';if(main.clientWidth!==previousWidth){previousWidth=main.clientWidth;render();}}).observe(document.querySelector('main'));render();
</script></body></html>
