<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One column at a time</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#202124;font:17px/1.35 Palatino,serif}main{padding:14px}h1{font-size:22px;margin:0 0 10px}.equation{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.matrix{display:inline-grid;gap:2px 7px;border-left:2px solid;border-right:2px solid;border-radius:4px;padding:4px 7px;text-align:center}.matrix span{min-width:24px;padding:2px}.active1{background:#e0ecff;border-bottom:3px solid #3d81f6}.active2{background:#fff1d9;border-bottom:3px dashed orange}.name{text-align:center;font-size:14px;color:#465268}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}button{font:inherit;min-height:40px;padding:5px 12px;background:white;border:1px solid #586577;border-radius:4px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e0ecff;border-color:#3d81f6}button:focus-visible{outline:3px solid #3d81f6;outline-offset:3px}#plot{height:330px}#calculation{min-height:72px;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}@media(max-width:470px){main{padding:10px}.equation{gap:6px}.matrix{gap:2px 4px;padding:3px 5px}.matrix span{min-width:20px}#plot{height:510px}}</style></head><body><main><h1>One column at a time</h1>
<div class="equation"><div><div class="name">A</div><div id="a" class="matrix" role="img"></div></div><div><div class="name">B</div><div id="b" class="matrix" role="img"></div></div><span>=</span><div><div class="name">AB</div><div id="ab" class="matrix" role="img"></div></div></div>
<div class="controls"><button id="column1" aria-pressed="true">Column 1</button><button id="column2" aria-pressed="false">Column 2</button><button id="both" aria-pressed="false">Full product</button></div>
<div id="plot" role="img"></div><div id="calculation" role="img"></div>
</main><script>/* PLOTLY_BUNDLE */</script><script>
const $=id=>document.getElementById(id),A=[[4,-3,7],[-2,6,0]],B=[[5,-4],[-2,8],[3,-6]],BLUE='#3d81f6',ORANGE='orange';let selected=0,busy=false,pending=false;
const product=A.map(row=>B[0].map((_,j)=>row.reduce((s,v,k)=>s+v*B[k][j],0))),minus=x=>String(x).replace('-','−');
const matrix=(id,M,cols,highlight=false)=>{$(id).style.gridTemplateColumns=`repeat(${cols},1fr)`;$(id).innerHTML=M.flat().map((v,k)=>{const j=k%cols,active=highlight&&(selected===2||j===selected);return `<span class="${active?'active'+(j+1):''}">${id==='ab'&&!active?'?':minus(v)}</span>`}).join('');$(id).setAttribute('aria-label',id.toUpperCase()+' rows: '+M.map(r=>r.map(minus).join(', ')).join('; '));};
const vector=xs=>`<span class="matrix" style="grid-template-columns:1fr" aria-hidden="true">${xs.map(x=>`<span>${minus(x)}</span>`).join('')}</span>`;
async function render(){pending=true;if(busy)return;busy=true;try{while(pending){pending=false;matrix('a',A,3);matrix('b',B,2,true);matrix('ab',product,2,true);for(const [id,j]of[['column1',0],['column2',1],['both',2]])$(id).setAttribute('aria-pressed',String(selected===j));
const js=selected===2?[0,1]:[selected],data=[],annotations=[],project3=v=>[v[0]-.55*v[1],v[2]+.35*v[1]];
for(const [u,v,label] of [[[0,0],[6,0],'1'],[[0,0],[-3.3,2.1],'2'],[[0,0],[0,6],'3']]){data.push({type:'scatter',x:[u[0],v[0]],y:[u[1],v[1]],mode:'lines',line:{color:'#cbd5e1',width:1},hoverinfo:'skip'});annotations.push({x:v[0],y:v[1],xref:'x',yref:'y',text:label,showarrow:false,font:{color:'#7b8794',size:13}});}
for(const j of js){const color=j?ORANGE:BLUE,input=project3(B.map(r=>r[j])),output=product.map(r=>r[j]),dash=j?'dash':'solid';data.push({type:'scatter',x:[0,input[0]],y:[0,input[1]],mode:'lines',line:{color,width:3,dash},hoverinfo:'skip'},{type:'scatter',x:[0,output[0]],y:[0,output[1]],xaxis:'x2',yaxis:'y2',mode:'lines',line:{color,width:3,dash},hoverinfo:'skip'});annotations.push({x:input[0],y:input[1],ax:0,ay:0,xref:'x',yref:'y',axref:'x',ayref:'y',text:'',showarrow:true,arrowhead:3,arrowwidth:2,arrowcolor:color},{x:output[0],y:output[1],ax:0,ay:0,xref:'x2',yref:'y2',axref:'x2',ayref:'y2',text:'',showarrow:true,arrowhead:3,arrowwidth:2,arrowcolor:color},{x:input[0],y:input[1],xref:'x',yref:'y',text:'b'+(j?'₂':'₁'),showarrow:false,xshift:13,yshift:14,bgcolor:'white'},{x:output[0],y:output[1],xref:'x2',yref:'y2',text:'A b'+(j?'₂':'₁'),showarrow:false,xshift:16,yshift:14,bgcolor:'white'});}
const narrow=document.querySelector('main').clientWidth<470,base={zerolinecolor:'#8b96a5',gridcolor:'#edf0f5',fixedrange:true};annotations.push({xref:'paper',yref:'paper',x:narrow?.5:.22,y:narrow?1:.98,text:'Input column in ℝ³',showarrow:false,yshift:20,font:{size:16}},{xref:'paper',yref:'paper',x:narrow?.5:.78,y:narrow?.42:.98,text:'Output column in ℝ²',showarrow:false,yshift:20,font:{size:16}});await Plotly.react('plot',data,{paper_bgcolor:'white',plot_bgcolor:'white',font:{family:'Palatino, serif',size:14},margin:{l:34,r:22,t:38,b:28},showlegend:false,annotations,xaxis:{...base,range:[-10,8],dtick:4,domain:narrow?[0,1]:[0,.44]},yaxis:{...base,range:[-5,7],dtick:3,domain:narrow?[.58,1]:[0,1],scaleanchor:'x'},xaxis2:{...base,range:[-95,65],dtick:40,domain:narrow?[0,1]:[.56,1],anchor:'y2'},yaxis2:{...base,range:[-35,70],dtick:25,domain:narrow?[0,.42]:[0,1],anchor:'x2'}},{staticPlot:true,responsive:true,displayModeBar:false});
if(selected<2){const input=B.map(r=>r[selected]),output=product.map(r=>r[selected]);$('calculation').innerHTML='<span>A</span>'+vector(input)+'<span>=</span>'+vector(output);$('calculation').setAttribute('aria-label','A times column '+(selected+1)+' of B equals column vector '+output.join(', '));}else{$('calculation').textContent='The outputs become the columns of AB, in the same order.';$('calculation').setAttribute('aria-label',$('calculation').textContent);}$('plot').setAttribute('aria-label','Components of '+(selected===2?'both input and output columns':'input column '+(selected+1)+' and its output'));}}finally{busy=false;}}
for(const [id,j]of[['column1',0],['column2',1],['both',2]])$(id).onclick=()=>{selected=j;render()};let previousWidth=0;new ResizeObserver(()=>{const main=document.querySelector('main');if(window.frameElement)window.frameElement.style.height=Math.ceil(main.getBoundingClientRect().height+4)+'px';if(main.clientWidth!==previousWidth){previousWidth=main.clientWidth;render()}}).observe(document.querySelector('main'));render();
</script></body></html>
