<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transform a whole grid</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#202124;font:17px/1.4 Palatino,'Palatino Linotype',serif}main{padding:16px}h1{font-size:23px;margin:0 0 8px}p{margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center}label{display:block}select{font:inherit;padding:8px;max-width:100%;min-height:42px}input{accent-color:#3d81f6;min-height:40px;width:100%}.slider{flex:1;min-width:180px}output{float:right}#plot{height:370px;width:100%}.matrix{display:inline-grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;border-left:2px solid;border-right:2px solid;border-radius:4px;padding:3px 10px;vertical-align:middle;text-align:center}.equation{text-align:center}.hint{font-size:15px;color:#465268}select:focus-visible,input:focus-visible{outline:3px solid #3d81f6;outline-offset:3px}@media(max-width:430px){main{padding:12px}#plot{height:300px}}</style></head><body><main>
<h1>Transform a whole grid</h1><p class="hint">The faint grid is the input. The blue grid is its image. Follow the two basis arrows.</p>
<div class="controls"><div><label for="kind">Transformation</label><select id="kind"><option value="shear">Horizontal shear</option><option value="rotation">Rotation</option><option value="scale">Horizontal scaling</option><option value="reflection">Reflection across x-axis</option><option value="projection">Projection onto x-axis</option></select></div><div class="slider"><label for="amount"><span id="amount-label">Shear amount k</span><output id="value">1</output></label><input id="amount" type="range" min="-2" max="2" step="0.05" value="1"></div></div>
<div id="plot" role="img" aria-label="A sheared unit square on a coordinate grid"></div>
<p class="equation">A = <span id="matrix" class="matrix" role="img" aria-label="Matrix rows: 1, 1; 0, 1"><span>1</span><span>1</span><span>0</span><span>1</span></span></p>
<p class="hint" id="description" role="status" aria-live="polite"></p>
</main><script>/* PLOTLY_BUNDLE */</script><script>
const $=id=>document.getElementById(id),BLUE='#3d81f6',ORANGE='orange';
let busy=false,pending=false;
const maps={shear:{min:-2,max:2,step:.05,value:1,label:'Shear amount k'},rotation:{min:-180,max:180,step:5,value:45,label:'Angle θ (degrees)'},scale:{min:-2,max:3,step:.05,value:2,label:'Horizontal scale'},reflection:{min:0,max:1,step:1,value:1,label:'Fixed transformation'},projection:{min:0,max:1,step:1,value:1,label:'Fixed transformation'}};
function matrix(kind,a){const t=a*Math.PI/180;return kind==='shear'?[[1,a],[0,1]]:kind==='rotation'?[[Math.cos(t),-Math.sin(t)],[Math.sin(t),Math.cos(t)]]:kind==='scale'?[[a,0],[0,1]]:kind==='reflection'?[[1,0],[0,-1]]:[[1,0],[0,0]];}
function project(p,A){return A.map(row=>row[0]*p[0]+row[1]*p[1]);}
const fmt=x=>Math.abs(x)<1e-8?'0':Number(x.toFixed(2)).toString().replace('-','−');
async function render(){pending=true;if(busy)return;busy=true;try{while(pending){pending=false;const kind=$('kind').value,a=Number($('amount').value),A=matrix(kind,a),data=[];const grid=[];for(let i=-3;i<=3;i++)grid.push([i,-3],[i,3],null,[-3,i],[3,i],null);
function trace(points,color,width=1,dash='solid',fill=false){const q=points.map(p=>p?project(p,A):[null,null]);data.push({type:'scatter',x:q.map(p=>p[0]),y:q.map(p=>p[1]),mode:'lines',line:{color,width,dash},fill:fill?'toself':undefined,fillcolor:'rgba(61,129,246,.16)',hoverinfo:'skip'});}
data.push({type:'scatter',x:grid.map(p=>p?p[0]:null),y:grid.map(p=>p?p[1]:null),mode:'lines',line:{color:'#dce1e9',width:1,dash:'dot'},hoverinfo:'skip'});trace(grid,'#a4c4fa');trace([[0,0],[1,0],[1,1],[0,1],[0,0]],BLUE,2,'solid',true);
const annotations=[];[[1,0],[0,1]].forEach((e,i)=>{trace([[0,0],e],[BLUE,ORANGE][i],4,i?'dash':'solid');const q=project(e,A);annotations.push({x:q[0],y:q[1],ax:0,ay:0,axref:'x',ayref:'y',showarrow:true,arrowhead:3,arrowwidth:2,arrowcolor:i?ORANGE:BLUE,text:''},{x:q[0],y:q[1],text:i?'A e₂':'A e₁',showarrow:false,xshift:i?-22:22,yshift:18,bgcolor:'white',font:{size:16}});});
$('matrix').innerHTML=A.flat().map(x=>'<span>'+fmt(x)+'</span>').join('');$('matrix').setAttribute('aria-label','Matrix rows: '+A.map(row=>row.map(fmt).join(', ')).join('; '));$('value').textContent=fmt(a)+(kind==='rotation'?'°':'');$('amount').setAttribute('aria-valuetext',$('value').textContent);
const description={shear:'The first column stays fixed. The second column slides sideways. The origin stays fixed.',rotation:'Both columns rotate through the same angle. Their lengths and right angle are preserved.',scale:'Only the first column changes. At scale 0, the square collapses to a line; negative scale flips it.',reflection:'The first column stays fixed; the second points downward. The square is reflected across the x-axis.',projection:'The second column is zero. Every vertical grid line collapses to one point on the x-axis.'}[kind];$('description').textContent=description;$('plot').setAttribute('aria-label',description+' Matrix rows '+A.map(row=>row.map(fmt).join(', ')).join('; '));
await Plotly.react('plot',data,{paper_bgcolor:'white',plot_bgcolor:'white',font:{family:'Palatino, serif',size:15},margin:{l:30,r:20,t:10,b:30},showlegend:false,xaxis:{range:[-3.5,3.5],dtick:1,zeroline:true,zerolinecolor:'#586577',fixedrange:true},yaxis:{range:[-2.5,3.5],dtick:1,zeroline:true,zerolinecolor:'#586577',scaleanchor:'x',fixedrange:true},annotations},{staticPlot:true,responsive:true,displayModeBar:false});$('plot').querySelectorAll('svg').forEach(svg=>svg.setAttribute('aria-hidden','true'));
}}finally{busy=false;}}
$('kind').onchange=()=>{const config=maps[$('kind').value];for(const k of ['min','max','step','value'])$('amount')[k]=config[k];$('amount').disabled=['reflection','projection'].includes($('kind').value);$('amount-label').textContent=config.label;render();};$('amount').oninput=render;
new ResizeObserver(()=>{if(window.frameElement)window.frameElement.style.height=Math.ceil(document.querySelector('main').getBoundingClientRect().height+4)+'px';}).observe(document.querySelector('main'));render();
</script></body></html>
